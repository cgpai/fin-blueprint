# fin-blueprint on CGP VPS — beside cgp-cgolangp
# DB: shared postgres-core (database fin_blueprint), reached via host network → 127.0.0.1:5432
services:
  app:
    build: .
    container_name: fin-blueprint
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3020'
      VITE_SHEETS_ENDPOINT: /api/state
