name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}","projectName":"fin-blueprint"}
          EOF
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull production settings
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Vercel "sensitive" env vars pull as `[SENSITIVE]` and break Vite client builds.
      # Force the real Sheets URL from GitHub secret so Sign in can load profiles.
      - name: Ensure Sheets endpoint for Vite build
        run: |
          set -euo pipefail
          ENV_FILE=".vercel/.env.production.local"
          touch "$ENV_FILE"
          grep -v '^VITE_SHEETS_ENDPOINT=' "$ENV_FILE" > "${ENV_FILE}.tmp" || true
          mv "${ENV_FILE}.tmp" "$ENV_FILE"
          echo "VITE_SHEETS_ENDPOINT=\"${VITE_SHEETS_ENDPOINT}\"" >> "$ENV_FILE"
          # Sanity: must be a real URL, never the redaction placeholder
          grep -E '^VITE_SHEETS_ENDPOINT="https://' "$ENV_FILE"
          ! grep -F 'VITE_SHEETS_ENDPOINT="[SENSITIVE]"' "$ENV_FILE"
        env:
          VITE_SHEETS_ENDPOINT: ${{ secrets.VITE_SHEETS_ENDPOINT }}

      - name: Build (local prebuilt)
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SHEETS_ENDPOINT: ${{ secrets.VITE_SHEETS_ENDPOINT }}

      # Deploy from a copy without .git so Hobby "git author must be team member" does not block.
      - name: Deploy production
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          rsync -a --exclude .git ./ "$STAGE"/
          cd "$STAGE"
          npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
